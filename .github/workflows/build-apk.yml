name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        shell: bash
        run: |
          set -e

          echo "Mencari ZIP..."

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -iname "*.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP tidak ditemukan."
            exit 1
          fi

          echo "ZIP ditemukan:"
          echo "$ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/project"
          mkdir -p "$GITHUB_WORKSPACE/project"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/project"

          echo "Isi project:"
          find "$GITHUB_WORKSPACE/project" \
            -maxdepth 2 \
            -type f | head -80

      - name: Find Android project root
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/project" \
            -type f \
            \( \
              -name "settings.gradle.kts" \
              -o \
              -name "settings.gradle" \
            \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle tidak ditemukan."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS_FILE")

          echo "Android project:"
          echo "$PROJECT_ROOT"

          if [ ! -d "$PROJECT_ROOT/app" ]; then
            echo "ERROR: Folder app tidak ditemukan."
            echo "Struktur project:"
            find "$PROJECT_ROOT" -maxdepth 2 -type d
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Check project
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          echo "Project root:"
          pwd

          echo ""
          echo "Isi project:"
          ls -la

          echo ""
          echo "Isi folder app:"
          ls -la app

          echo ""
          echo "Gradle version:"
          gradle --version

      - name: Create debug keystore
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Find APK
        shell: bash
        run: |
          echo "Mencari APK..."

          find "${{ env.PROJECT_ROOT }}/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: App1-APK
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

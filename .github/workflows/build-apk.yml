name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Android project
        shell: bash
        run: |
          set -e

          echo "Mencari file ZIP..."

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: File ZIP tidak ditemukan."
            exit 1
          fi

          echo "ZIP ditemukan:"
          echo "$ZIP_FILE"

          rm -rf project
          mkdir -p project

          echo "Mengekstrak project..."
          unzip -q "$ZIP_FILE" -d project

          echo "Isi hasil ekstraksi:"
          find project -maxdepth 2 -type f | head -50

      - name: Find Android project root
        shell: bash
        run: |
          set -e

          PROJECT_ROOT=$(find "$GITHUB_WORKSPACE/project" \
            -name "settings.gradle.kts" \
            -o -name "settings.gradle" \
            | head -n 1)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: settings.gradle.kts tidak ditemukan."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$PROJECT_ROOT")

          echo "Android project ditemukan di:"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK platform
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "platforms;android-36-ext1"

      - name: Create debug keystore
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Make Gradle executable
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Find generated APK
        shell: bash
        run: |
          echo "APK yang berhasil dibuat:"
          find "$PROJECT_ROOT/app/build/outputs/apk" -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: App1-APK
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
